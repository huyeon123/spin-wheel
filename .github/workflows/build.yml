name: Test and export
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.6.3
      GODOT: /tmp/godot/godot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot
        run: |
          mkdir -p /tmp/godot
          curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT"
          chmod +x "$GODOT"
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.6.3.stable
          key: godot-4.6.3-native-templates-v1
      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: ./scripts/install_templates.sh
      - name: Verify preinstalled Android SDK
        run: |
          : "${ANDROID_HOME:?GitHub Ubuntu runner must provide ANDROID_HOME}"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.1" >> "$GITHUB_PATH"
      - name: Import resources
        run: '"$GODOT" --headless --path . --editor --import'
      - name: Run tests
        run: '"$GODOT" --headless --path . --script tests/test_model.gd'
      - name: Run UI smoke tests
        run: XDG_DATA_HOME="$(mktemp -d)" "$GODOT" --headless --path . --script tests/test_ui.gd
      - name: Test responsive layouts
        run: XDG_DATA_HOME="$(mktemp -d)" "$GODOT" --headless --path . --script tests/test_layout.gd
      - name: Test settings overlays
        run: XDG_DATA_HOME="$(mktemp -d)" "$GODOT" --headless --path . --script tests/test_overlays.gd
      - name: Test swipe gestures
        run: XDG_DATA_HOME="$(mktemp -d)" "$GODOT" --headless --path . --script tests/test_gestures.gd
      - name: Test result display
        run: XDG_DATA_HOME="$(mktemp -d)" "$GODOT" --headless --path . --script tests/test_result.gd
      - name: Test custom selectors
        run: XDG_DATA_HOME="$(mktemp -d)" "$GODOT" --headless --path . --script tests/test_selectors.gd
      - name: Test integer weights
        run: XDG_DATA_HOME="$(mktemp -d)" "$GODOT" --headless --path . --script tests/test_integer_weights.gd
      - name: Test fixed Control layers
        run: XDG_DATA_HOME="$(mktemp -d)" "$GODOT" --headless --path . --script tests/test_fixed_layers.gd
      - name: Test manager and reordering
        run: |
          for suite in test_manager test_reorder_handle test_reorder_integration test_drag_continuity test_history test_editor_bounds test_window_geometry test_narrow_layers test_duration_input test_new_preset test_mobile_layout test_editor_focus; do
            XDG_DATA_HOME="$(mktemp -d)" "$GODOT" --headless --path . --script "tests/$suite.gd"
          done
      - name: Test rendered button state contrast
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          for suite in test_button_states test_wheel_pixels test_close_icons test_shadow_pixels test_duration_input test_editor_focus; do
            XDG_DATA_HOME="$(mktemp -d)" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$GODOT" --path . --audio-driver Dummy --rendering-method gl_compatibility --script "tests/$suite.gd"
          done
      - name: Test native portrait startup
        run: XDG_DATA_HOME="$(mktemp -d)" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$GODOT" --path . --audio-driver Dummy --rendering-method gl_compatibility --script tests/test_window_geometry.gd -- --window-geometry-live
      - name: Export Windows and Android
        run: ./scripts/build.sh all
      - name: Package Windows bundle
        run: ./scripts/package_windows.sh
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: SpinWheel-Windows-x86_64
          path: build/SpinWheel-Windows-x86_64.zip
          if-no-files-found: error
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: SpinWheel-Android-arm64-debug
          path: build/android/SpinWheel-debug.apk
          if-no-files-found: error
